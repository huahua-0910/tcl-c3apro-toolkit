name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_public.py
      - run: git diff --check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build both first-party applications
        run: |
          python3 tools/build_android.py --app settings-hub --java-home "$JAVA_HOME" --sdk-jar "$ANDROID_HOME/platforms/android-34/android.jar" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          python3 tools/build_android.py --app google-policy --java-home "$JAVA_HOME" --sdk-jar "$ANDROID_HOME/platforms/android-34/android.jar" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: settings-hub-ci-ephemeral-signature
          path: |
            dist/settings-hub-0.1.0.apk
            dist/settings-hub-build.json
            dist/settings-hub-signature.txt
